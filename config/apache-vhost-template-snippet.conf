# radicale_dav plugin -- insert this block into a *copy* of DirectAdmin's
# SSL virtual host template, so every domain (present and future) gets
# /caldav proxied to the local Radicale service.
#
# ---- One-time setup ----
#
#   cd /usr/local/directadmin/data/templates
#   cp virtual_host2_secure.conf custom/
#   cd custom
#
# Open virtual_host2_secure.conf and paste the block below just before
# the closing </VirtualHost> (or anywhere inside the vhost body -- it
# doesn't depend on any of DA's |TOKEN| substitutions, so placement
# only matters relative to other Location/Proxy directives you may
# already have).
#
# Then regenerate every existing domain's Apache config from the
# updated template and reload Apache:
#
#   cd /usr/local/directadmin/custombuild
#   ./build rewrite_confs
#   service httpd reload      # or: systemctl reload httpd
#
# New domains created after this point pick up the block automatically
# -- no per-domain step needed.
#
# Requires mod_proxy, mod_proxy_http and mod_headers to be built into
# Apache (check with: httpd -M | grep -E 'proxy|headers'). DA/CustomBuild
# usually has these already; if not, enable them via CustomBuild's Apache
# module options and rebuild Apache.

    # --- radicale_dav: CalDAV/CardDAV under /caldav ---
    ProxyPass        /caldav/ http://127.0.0.1:5232/ retry=0
    ProxyPassReverse /caldav/ http://127.0.0.1:5232/
    RequestHeader set X-Script-Name /caldav
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    <Location "/caldav/">
        Require all granted
    </Location>

    # CalDAV/CardDAV auto-discovery: lets clients that only ask for
    # "domain.tld" find the right path themselves (Apple Calendar,
    # DAVx5, Thunderbird, etc. all try these first).
    Redirect permanent /.well-known/caldav  /caldav/
    Redirect permanent /.well-known/carddav /caldav/
    # --- end radicale_dav ---
