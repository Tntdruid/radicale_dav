# /etc/fail2ban/filter.d/radicale.conf
#
# Matches Radicale's failed-login warning. Behind the Apache proxy the
# client address is in X-Forwarded-For; Apache appends the real client
# to the end of that list, so only the last entry is used (earlier ones
# can be forged by the client).
#
# Example journal line:
#   [WARNING] Failed login attempt from 127.0.0.1 (forwarded for '203.0.113.7'): 'alice@example.com' (...)

[Definition]
failregex = Failed login attempt from \S+ \(forwarded for '(?:[^']*,\s*)?<HOST>'\):
ignoreregex =
