# /etc/fail2ban/jail.d/radicale.conf
#
# Bans clients that repeatedly fail CalDAV/CardDAV logins (mail passwords
# are used here, so this also protects the mail accounts).

[radicale]
enabled  = true
filter   = radicale
backend  = systemd
journalmatch = _SYSTEMD_UNIT=radicale.service
port     = http,https
maxretry = 5
findtime = 10m
bantime  = 1h
