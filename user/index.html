#!/usr/local/bin/php
<?php
require_once __DIR__ . '/../lang.php';
$strings = radicale_language();
$escape = static function (string $value): string {
    return htmlspecialchars($value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
};
?>
<div style="max-width:640px">
  <h2><?= $escape($strings['title']) ?></h2>

  <p><?= $escape($strings['intro']) ?></p>

    <form id="radicale-url-form">
    <p>
      <label for="mailbox"><?= $escape($strings['mailbox']) ?></label><br>
        <input type="email" id="mailbox" name="mailbox" placeholder="alice@example.com" required style="width:260px">
      <button type="submit"><?= $escape($strings['submit']) ?></button>
    </p>
  </form>

  <p id="radicale-error" role="alert" hidden><?= $escape($strings['invalid']) ?></p>
    <div id="radicale-results" hidden>
      <table cellpadding="4">
        <tr><td><strong><?= $escape($strings['server']) ?></strong></td><td><code id="server-url"></code></td></tr>
        <tr><td><strong><?= $escape($strings['calendar']) ?></strong></td><td><a id="calendar-url"><code></code></a></td></tr>
        <tr><td><strong><?= $escape($strings['addressbook']) ?></strong></td><td><a id="addressbook-url"><code></code></a></td></tr>
        <tr><td><strong><?= $escape($strings['username']) ?></strong></td><td><code id="username"></code></td></tr>
      </table>
      <p><a id="manager-url" target="_blank" rel="noopener"><?= $escape($strings['manager']) ?></a></p>

      <h3><?= $escape($strings['share_title']) ?></h3>
      <ol>
        <li><?= $escape($strings['share_1']) ?></li>
        <li><?= $escape($strings['share_2']) ?></li>
        <li><?= $escape($strings['share_3']) ?></li>
        <li><?= $escape($strings['share_4']) ?></li>
        <li><?= $escape($strings['share_5']) ?></li>
      </ol>
      <p><em><?= $escape($strings['share_note']) ?></em></p>
      <p><em><?= $escape($strings['app_note']) ?></em></p>

      <h3><?= $escape($strings['clients_title']) ?></h3>
      <details>
        <summary><strong><?= $escape($strings['client_apple']) ?></strong></summary>
        <p><a id="apple-profile" download="calendar-contacts.mobileconfig"><?= $escape($strings['apple_profile']) ?></a></p>
        <p><?= $escape($strings['apple_profile_note']) ?></p>
        <p><?= $escape($strings['apple_manual']) ?></p>
      </details>
      <details>
        <summary><strong><?= $escape($strings['client_thunderbird']) ?></strong></summary>
        <ol>
          <li><?= $escape($strings['thunderbird_1']) ?></li>
          <li><?= $escape($strings['thunderbird_2']) ?></li>
          <li><?= $escape($strings['thunderbird_3']) ?></li>
        </ol>
      </details>
      <details>
        <summary><strong><?= $escape($strings['client_android']) ?></strong></summary>
        <ol>
          <li><?= $escape($strings['android_1']) ?></li>
          <li><?= $escape($strings['android_2']) ?></li>
          <li><?= $escape($strings['android_3']) ?></li>
        </ol>
      </details>
    </div>

    <script>
    (function () {
      var form = document.getElementById('radicale-url-form');
      var mailboxInput = document.getElementById('mailbox');
      var results = document.getElementById('radicale-results');
      var error = document.getElementById('radicale-error');
      var appleProfile = document.getElementById('apple-profile');
      var profileUrl = null;

      function xml(value) {
        return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
      }

      function uuid() {
        if (window.crypto && crypto.randomUUID) {
          return crypto.randomUUID().toUpperCase();
        }
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          var r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 3 | 8)).toString(16).toUpperCase();
        });
      }

      // Unsigned Apple configuration profile with a CalDAV and a CardDAV
      // account. No password is included; the device asks for it on install.
      function accountPayload(kind, type, domain, mailbox, id) {
        return '<dict>' +
          '<key>' + kind + 'AccountDescription</key><string>' + xml(mailbox) + '</string>' +
          '<key>' + kind + 'HostName</key><string>' + xml(domain) + '</string>' +
          '<key>' + kind + 'Port</key><integer>443</integer>' +
          '<key>' + kind + 'PrincipalURL</key><string>' + xml('/caldav/' + mailbox + '/') + '</string>' +
          '<key>' + kind + 'UseSSL</key><true/>' +
          '<key>' + kind + 'Username</key><string>' + xml(mailbox) + '</string>' +
          '<key>PayloadIdentifier</key><string>' + xml(id + '.' + kind.toLowerCase()) + '</string>' +
          '<key>PayloadType</key><string>' + type + '</string>' +
          '<key>PayloadUUID</key><string>' + uuid() + '</string>' +
          '<key>PayloadVersion</key><integer>1</integer>' +
          '</dict>';
      }

      function setAppleProfile(domain, mailbox) {
        var id = 'radicale-dav.' + domain + '.' + mailbox.replace(/[^A-Za-z0-9.-]/g, '-');
        // '<' + '?' keeps PHP (short_open_tag) from treating this as a PHP tag.
        var profile = '<' + '?xml version="1.0" encoding="UTF-8"?' + '>\n' +
          '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n' +
          '<plist version="1.0"><dict>' +
          '<key>PayloadContent</key><array>' +
          accountPayload('CalDAV', 'com.apple.caldav.account', domain, mailbox, id) +
          accountPayload('CardDAV', 'com.apple.carddav.account', domain, mailbox, id) +
          '</array>' +
          '<key>PayloadDisplayName</key><string>' + xml(mailbox) + '</string>' +
          '<key>PayloadIdentifier</key><string>' + xml(id) + '</string>' +
          '<key>PayloadType</key><string>Configuration</string>' +
          '<key>PayloadUUID</key><string>' + uuid() + '</string>' +
          '<key>PayloadVersion</key><integer>1</integer>' +
          '</dict></plist>\n';
        if (profileUrl) {
          URL.revokeObjectURL(profileUrl);
        }
        profileUrl = URL.createObjectURL(new Blob([profile], { type: 'application/x-apple-aspen-config' }));
        appleProfile.href = profileUrl;
        appleProfile.download = mailbox.replace(/[^A-Za-z0-9@.-]/g, '-') + '.mobileconfig';
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        var mailbox = mailboxInput.value.trim();
        var at = mailbox.lastIndexOf('@');
        var domain = at > 0 ? mailbox.slice(at + 1).toLowerCase() : '';
        var valid = mailboxInput.checkValidity() && domain.indexOf('.') > 0 && domain.indexOf('.') < domain.length - 1;

        if (!valid) {
          results.hidden = true;
          error.hidden = false;
          return;
        }

        var baseUrl = 'https://' + domain + '/caldav';
        var calendarUrl = baseUrl + '/' + mailbox + '/calendar/';
        var addressbookUrl = baseUrl + '/' + mailbox + '/addressbook/';

        document.getElementById('server-url').textContent = baseUrl;
        document.getElementById('calendar-url').href = calendarUrl;
        document.getElementById('calendar-url').firstChild.textContent = calendarUrl;
        document.getElementById('addressbook-url').href = addressbookUrl;
        document.getElementById('addressbook-url').firstChild.textContent = addressbookUrl;
        document.getElementById('username').textContent = mailbox;
        document.getElementById('manager-url').href = baseUrl + '/.web/';
        setAppleProfile(domain, mailbox);
        error.hidden = true;
        results.hidden = false;
      });
    }());
    </script>
</div>
