#!/usr/local/bin/php
<?php
require_once __DIR__ . '/../lang.php';
$strings = radicale_language();
$escape = static function (string $value): string {
    return htmlspecialchars($value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
};
?>
<div style="max-width:640px">
  <h2><?= $escape($strings['title']) ?></h2>

  <p><?= $escape($strings['intro']) ?></p>

    <form id="radicale-url-form">
    <p>
      <label for="mailbox"><?= $escape($strings['mailbox']) ?></label><br>
        <input type="email" id="mailbox" name="mailbox" placeholder="alice@example.com" required style="width:260px">
      <button type="submit"><?= $escape($strings['submit']) ?></button>
    </p>
  </form>

  <p id="radicale-error" role="alert" hidden><?= $escape($strings['invalid']) ?></p>
    <div id="radicale-results" hidden>
      <table cellpadding="4">
        <tr><td><strong><?= $escape($strings['server']) ?></strong></td><td><code id="server-url"></code></td></tr>
        <tr><td><strong><?= $escape($strings['calendar']) ?></strong></td><td><a id="calendar-url"><code></code></a></td></tr>
        <tr><td><strong><?= $escape($strings['addressbook']) ?></strong></td><td><a id="addressbook-url"><code></code></a></td></tr>
        <tr><td><strong><?= $escape($strings['username']) ?></strong></td><td><code id="username"></code></td></tr>
      </table>
      <p><a id="manager-url" target="_blank" rel="noopener"><?= $escape($strings['manager']) ?></a></p>

      <h3><?= $escape($strings['share_title']) ?></h3>
      <ol>
        <li><?= $escape($strings['share_1']) ?></li>
        <li><?= $escape($strings['share_2']) ?></li>
        <li><?= $escape($strings['share_3']) ?></li>
        <li><?= $escape($strings['share_4']) ?></li>
        <li><?= $escape($strings['share_5']) ?></li>
      </ol>
      <p><em><?= $escape($strings['share_note']) ?></em></p>
      <p><em><?= $escape($strings['app_note']) ?></em></p>
    </div>

    <script>
    (function () {
      var form = document.getElementById('radicale-url-form');
      var mailboxInput = document.getElementById('mailbox');
      var results = document.getElementById('radicale-results');
      var error = document.getElementById('radicale-error');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        var mailbox = mailboxInput.value.trim();
        var at = mailbox.lastIndexOf('@');
        var domain = at > 0 ? mailbox.slice(at + 1).toLowerCase() : '';
        var valid = mailboxInput.checkValidity() && domain.indexOf('.') > 0 && domain.indexOf('.') < domain.length - 1;

        if (!valid) {
          results.hidden = true;
          error.hidden = false;
          return;
        }

        var baseUrl = 'https://' + domain + '/caldav';
        var calendarUrl = baseUrl + '/' + mailbox + '/calendar/';
        var addressbookUrl = baseUrl + '/' + mailbox + '/addressbook/';

        document.getElementById('server-url').textContent = baseUrl;
        document.getElementById('calendar-url').href = calendarUrl;
        document.getElementById('calendar-url').firstChild.textContent = calendarUrl;
        document.getElementById('addressbook-url').href = addressbookUrl;
        document.getElementById('addressbook-url').firstChild.textContent = addressbookUrl;
        document.getElementById('username').textContent = mailbox;
        document.getElementById('manager-url').href = baseUrl + '/.web/';
        error.hidden = true;
        results.hidden = false;
      });
    }());
    </script>
</div>
